name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test client deps
        run: |
          pip install -r kafka/requirements.txt
          pip install -r processor/requirements.txt
          pip install pytest redis==8.1.0

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build and start the full stack
        run: |
          # No separate "wait for kafka-init" step: otel-collector depends
          # on it via `service_completed_successfully`, so `up` already
          # blocks until kafka-init (and everything else) is ready.
          docker compose up -d --build

      - name: Phase 1 -- Kafka/OTel ingestion smoke test
        run: python kafka/smoke_test.py

      - name: Phase 2 -- recovery tests (replay dedup, DLQ, DB-outage retry)
        run: python tests/phase2/recovery_test.py

      - name: Phase 3 -- deterministic unit tests (rules + correlation)
        run: python -m pytest tests/phase3/test_rules.py tests/phase3/test_correlate.py -v

      - name: Phase 3 -- live fault-injection evaluation harness
        run: python tests/phase3/evaluation.py

      - name: Phase 4 -- management API integration tests
        run: python tests/phase4/api_test.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
