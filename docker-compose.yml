services:
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    container_name: pulseops-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "Y6st2osuTuyeRGb3BMScNA"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data/kraft-combined-logs"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [pulseops]

  kafka-init:
    image: apache/kafka:4.2.2
    container_name: pulseops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic otel.raw.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic otel.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=604800000 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    networks: [pulseops]

  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
    ports:
      # Host port deliberately not 5432: this machine already runs a native
      # Postgres on 127.0.0.1:5432 (see docs/DECISIONS.md) which silently
      # intercepts connections meant for this container. In-network traffic
      # (processor -> postgres:5432) is unaffected either way.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulseops} -d ${POSTGRES_DB:-pulseops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pulseops]

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pulseops]

  migrate:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: pulseops-migrate
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pulseops]

  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: pulseops-processor
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_RAW_TELEMETRY_TOPIC: ${KAFKA_RAW_TELEMETRY_TOPIC:-otel.raw.v1}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-otel.dlq.v1}
      KAFKA_CONSUMER_GROUP: pulseops-event-normalizer
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [pulseops]

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    container_name: pulseops-detector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [pulseops]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: pulseops-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health_check extension
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    # No Docker-level healthcheck: otel/opentelemetry-collector-contrib ships a
    # distroless image with no shell and no wget/curl binary, so a CMD/CMD-SHELL
    # probe can't run inside it. The health_check extension does listen on
    # :13133 (verified manually below) -- downstream services just depend on
    # "started" and tolerate the OTLP exporter retrying until it's ready.
    networks: [pulseops]

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    container_name: pulseops-payments
    environment:
      SERVICE_NAME: payments
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "${PAYMENTS_PORT:-8002}:8000"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pulseops]

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    container_name: pulseops-orders
    environment:
      SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      PAYMENTS_BASE_URL: http://payments:8000
    ports:
      - "${ORDERS_PORT:-8001}:8000"
    depends_on:
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pulseops]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: pulseops-gateway
    environment:
      SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      ORDERS_BASE_URL: http://orders:8000
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pulseops]

networks:
  pulseops:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  redis-data:
